<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>

<body>

    <header>
        <h1>Formulario de Registro</h1>
        <p>Completá los siguientes datos para registrarte.</p>
    </header>

    <main>

        <form action="#" method="post">

            <!-- Nombre completo -->
            <div>
                <label for="nombre">Nombre completo:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej: Juan Pérez"
                    required
                    tabindex="1"
                >
            </div>

            <br>

            <!-- Correo electrónico -->
            <div>
                <label for="correo">Correo electrónico:</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ej: correo@ejemplo.com"
                    required
                    tabindex="2"
                >
            </div>

            <br>

            <!-- Contraseña -->
            <div>
                <label for="contrasena">Contraseña:</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    required
                    tabindex="3"
                >
            </div>

            <br>

            <!-- Género -->
            <fieldset>
                <legend>Género:</legend>

                <input
                    type="radio"
                    id="masculino"
                    name="genero"
                    value="masculino"
                    required
                    tabindex="4"
                >
                <label for="masculino">Masculino</label>

                <input
                    type="radio"
                    id="femenino"
                    name="genero"
                    value="femenino"
                    tabindex="5"
                >
                <label for="femenino">Femenino</label>

                <input
                    type="radio"
                    id="otro"
                    name="genero"
                    value="otro"
                    tabindex="6"
                >
                <label for="otro">Otro</label>
            </fieldset>

            <br>

            <!-- Intereses -->
            <fieldset>
                <legend>Intereses:</legend>

                <input
                    type="checkbox"
                    id="musica"
                    name="intereses"
                    value="musica"
                    tabindex="7"
                >
                <label for="musica">Música</label>

                <input
                    type="checkbox"
                    id="deporte"
                    name="intereses"
                    value="deporte"
                    tabindex="8"
                >
                <label for="deporte">Deporte</label>

                <input
                    type="checkbox"
                    id="lectura"
                    name="intereses"
                    value="lectura"
                    tabindex="9"
                >
                <label for="lectura">Lectura</label>

                <input
                    type="checkbox"
                    id="videojuegos"
                    name="intereses"
                    value="videojuegos"
                    tabindex="10"
                >
                <label for="videojuegos">Videojuegos</label>
            </fieldset>

            <br>

            <!-- Comentarios -->
            <div>
                <label for="comentarios">Comentarios adicionales:</label>
                <br>
                <textarea
                    id="comentarios"
                    name="comentarios"
                    rows="5"
                    cols="40"
                    placeholder="Escribí tus comentarios..."
                    tabindex="11"
                ></textarea>
            </div>

            <br>

            <!-- País -->
            <div>
                <label for="pais">País:</label>

                <select
                    id="pais"
                    name="pais"
                    required
                    tabindex="12"
                >
                    <option value="">Seleccioná un país</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                    <option value="uruguay">Uruguay</option>
                </select>
            </div>

            <br>

            <!-- Botón de envío -->
            <div>
                <input
                    type="submit"
                    value="Registrarse"
                    tabindex="13"
                >
            </div>

        </form>

    </main>

    <footer>
        <p>© 2026 - Formulario de Registro</p>
    </footer>

</body>

</html>
