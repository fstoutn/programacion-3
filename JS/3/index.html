<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Practico JavaScript</title>
</head>
<body>

    <h1 id="titulo">Lista de tareas</h1>

    <!-- Punto 6: Lista inicial de elementos -->
    <ul id="lista">
        <li>Estudiar JavaScript</li>
        <li>Practicar DOM</li>
        <li>Hacer el trabajo practico</li>
    </ul>

    <!-- Punto 7: Input y boton para agregar elementos -->
    <h2>Agregar tarea</h2>

    <input type="text" id="inputTarea" placeholder="Ingrese una tarea">
    <button id="btnAgregar">Agregar tarea</button>

    <!-- Punto 8: Formulario -->
    <h2>Formulario</h2>

    <form id="formulario">
        <input type="text" id="inputFormulario" placeholder="Ingrese un texto">
        <button type="submit">Enviar</button>
    </form>

    <p id="mensajeFormulario"></p>

    <!-- Punto 9: Select -->
    <h2>Seleccionar opcion</h2>

    <select id="opciones">
        <option value="">Seleccione una opcion</option>
        <option value="JavaScript">JavaScript</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
    </select>

    <p id="opcionSeleccionada"></p>

    <script src="index.js"></script>
</body>
</html>
